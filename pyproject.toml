[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testoai"
version = "0.1.0"
description = "Food recommender using autoencoder embeddings + cosine similarity"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Damian Martinez" }]
license = { text = "MIT" }
dependencies = [
    "pandas",
    "scikit-learn",
    "torch",
    "pyarrow",
    "joblib",
    "kagglehub",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
testoai = "testoai.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
